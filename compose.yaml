services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: wingman-postgres
    environment:
      POSTGRES_USER: wingman
      POSTGRES_PASSWORD: wingman
      POSTGRES_DB: wingman
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wingman"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wingman-network

  # Chroma Vector Store
  chroma:
    image: ghcr.io/chroma-core/chroma:latest
    container_name: wingman-chroma
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      ALLOW_RESET: true
      ANONYMIZED_TELEMETRY: false
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/localhost/8000' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wingman-network

  # Pi Durable owns persisted agent sessions and Slack reply delivery.
  runtime:
    build: ./runtime
    env_file:
      - .env
    environment:
      PI_HOST: 0.0.0.0
      PI_DATA_DIR: /data
    volumes:
      - pi_data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wingman-network
    restart: unless-stopped

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wingman-backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    environment:
      PI_RUNTIME_URL: http://runtime:8002
    depends_on:
      runtime:
        condition: service_healthy
      postgres:
        condition: service_healthy
      chroma:
        condition: service_healthy
    volumes:
      - ./backend:/app
    networks:
      - wingman-network
    restart: unless-stopped

  # Slack Bot (separate service for socket mode)
  bot:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wingman-bot
    command: python run_bot.py
    env_file:
      - .env
    environment:
      PI_RUNTIME_URL: http://runtime:8002
    depends_on:
      runtime:
        condition: service_healthy
      postgres:
        condition: service_healthy
      chroma:
        condition: service_healthy
    volumes:
      - ./backend:/app
    networks:
      - wingman-network
    restart: unless-stopped

  # Frontend Dashboard
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wingman-frontend
    env_file:
      - .env
    ports:
      - "3000:8000"
    depends_on:
      - backend
    networks:
      - wingman-network
    restart: unless-stopped

volumes:
  postgres_data:
  chroma_data:
  pi_data:

networks:
  wingman-network:
    driver: bridge
